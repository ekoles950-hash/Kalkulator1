<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="pageTitle">Aplikasi Kasir Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .receipt-font { font-family: 'Courier New', Courier, monospace; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .tap-effect:active { transform: scale(0.95); transition: transform 0.1s; }
        
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="fixed inset-0 flex flex-col overflow-hidden text-gray-800 bg-gray-100">

    <!-- Header -->
    <header class="shrink-0 bg-blue-900 text-white p-2 px-4 shadow-md flex justify-between items-center z-10">
        <div>
            <h1 class="text-lg font-bold" id="storeNameDisplay">Toko / Warung Saya</h1>
            <p class="text-[10px] text-blue-200" id="storeLocationDisplay">Silakan Atur di Pengaturan</p>
        </div>
        <div class="flex items-center gap-3">
            <div class="text-right">
                <p class="text-[10px] opacity-80">No Pesanan</p>
                <p class="font-mono font-bold text-base" id="orderNo">#---</p>
            </div>
            <!-- Tombol Pengaturan -->
            <button onclick="openSettings()" class="bg-blue-800 p-2 rounded-lg border border-blue-700 tap-effect hover:bg-blue-700 text-blue-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Area Utama -->
    <div class="flex-1 flex flex-col lg:flex-row overflow-hidden">
        
        <!-- Kolom Kiri: Keranjang & Pembayaran -->
        <div class="flex-[0.8] flex flex-col bg-white border-r border-gray-200 lg:max-w-sm relative z-0">
            <div class="p-1.5 bg-gray-50 border-b border-gray-200 text-center receipt-font text-[10px] text-gray-500 font-bold tracking-wider shrink-0">
                KERANJANG PESANAN
            </div>

            <div class="flex-1 overflow-y-auto p-2 space-y-1.5 no-scrollbar" id="cartList">
                <!-- Item masuk ke sini -->
            </div>

            <!-- Panel Pembayaran -->
            <div class="p-2.5 bg-white border-t border-gray-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-10 shrink-0">
                <div class="flex justify-between items-end mb-2 border-b border-dashed border-gray-300 pb-1.5">
                    <span class="text-gray-600 text-xs font-semibold">Total Tagihan</span>
                    <span class="text-2xl font-extrabold text-blue-900" id="totalDisplay">Rp 0</span>
                </div>

                <div class="mb-2">
                    <div class="text-[10px] font-bold text-gray-500 mb-1">UANG DITERIMA:</div>
                    <div class="flex gap-1 mb-1.5">
                        <button onclick="setBayar('pas')" class="flex-1 bg-gray-100 border border-gray-300 text-gray-700 py-1.5 rounded text-[10px] font-bold tap-effect hover:bg-gray-200">Pas</button>
                        <button onclick="setBayar(10000)" class="flex-1 bg-purple-50 border border-purple-200 text-purple-700 py-1.5 rounded text-[10px] font-bold tap-effect hover:bg-purple-100">10k</button>
                        <button onclick="setBayar(20000)" class="flex-1 bg-green-50 border border-green-200 text-green-700 py-1.5 rounded text-[10px] font-bold tap-effect hover:bg-green-100">20k</button>
                        <button onclick="setBayar(50000)" class="flex-1 bg-blue-50 border border-blue-200 text-blue-700 py-1.5 rounded text-[10px] font-bold tap-effect hover:bg-blue-100">50k</button>
                        <button onclick="setBayar(100000)" class="flex-1 bg-red-50 border border-red-200 text-red-700 py-1.5 rounded text-[10px] font-bold tap-effect hover:bg-red-100">100k</button>
                    </div>
                    
                    <div class="flex justify-between items-center bg-gray-50 px-2 py-1 rounded border border-gray-100">
                        <span class="text-[10px] text-gray-500">Kembali:</span>
                        <span class="font-bold text-sm text-gray-400" id="kembalianDisplay">-</span>
                    </div>
                </div>

                <!-- Tombol Aksi (Reset, Cetak/Bagikan Universal, WhatsApp) -->
                <div class="grid grid-cols-5 gap-1.5 mt-1.5">
                    <button onclick="resetCart()" class="tap-effect bg-red-100 text-red-700 py-2 rounded-lg font-bold text-[11px] border border-red-200 hover:bg-red-200">
                        Reset
                    </button>
                    <button onclick="shareStrukUniversal()" class="col-span-2 tap-effect bg-green-600 text-white py-2 rounded-lg font-bold text-xs shadow-md hover:bg-green-700 flex items-center justify-center gap-1">
                        🖨️ Cetak / Bagikan
                    </button>
                    <button onclick="shareWhatsApp()" class="col-span-2 tap-effect bg-emerald-600 text-white py-2 rounded-lg font-bold text-xs shadow-md hover:bg-emerald-700 flex items-center justify-center gap-1">
                        💬 WhatsApp
                    </button>
                </div>
            </div>
        </div>

        <!-- Kolom Kanan: Daftar Menu -->
        <div class="flex-[1.2] bg-gray-100 flex flex-col overflow-hidden">
            <div class="p-1 bg-gray-200 text-[10px] font-bold text-gray-500 uppercase tracking-wide text-center shrink-0">Daftar Menu Produk</div>
            <div class="flex-1 overflow-y-auto p-1.5 no-scrollbar">
                <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-1.5 pb-2" id="menuGrid">
                    <!-- Menu Buttons -->
                </div>
            </div>
        </div>
    </div>

    <!-- Footer: Laporan Keuangan Manual ke Telegram -->
    <div class="shrink-0 bg-slate-800 p-2 shadow-[0_-4px_10px_rgba(0,0,0,0.2)] z-20 flex flex-col gap-1 w-full safe-area-bottom">
        <div class="flex justify-between items-center ml-1 mr-1">
            <div class="text-amber-300 text-[11px] font-bold tracking-wide">
                Pemasukan hari ini!
            </div>
            <div class="flex items-center gap-1.5">
                <span class="text-slate-400 text-[10px] font-semibold">Jaga:</span>
                <input type="text" id="namaPenjaga" placeholder="Nama Penjaga..." class="bg-slate-700 text-white text-[10px] font-bold rounded py-1 px-2 border border-slate-600 outline-none focus:border-blue-400 w-28">
            </div>
        </div>
        
        <div class="flex gap-2 w-full items-center">
            <div class="flex-1 flex items-center bg-slate-700 rounded-lg overflow-hidden border border-slate-600 focus-within:border-blue-400 focus-within:ring-1 focus-within:ring-blue-400 transition-all h-10">
                <span class="pl-2.5 pr-1.5 text-slate-400 font-bold text-sm">Rp</span>
                <input type="number" id="inputPemasukan" placeholder="Nominal..." class="w-full h-full bg-transparent text-white pr-2 outline-none font-bold text-sm">
            </div>

            <button onclick="kirimTelegramManual()" id="btnKirimTelegram" class="tap-effect h-10 bg-blue-500 text-white px-4 rounded-lg text-sm font-bold shadow-md hover:bg-blue-600 flex items-center justify-center gap-1.5 transition-colors whitespace-nowrap">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
                Kirim
            </button>
        </div>
    </div>

    <!-- MODAL PENGATURAN (SETTINGS) -->
    <div id="settingsModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            <div class="bg-blue-900 text-white p-3 px-4 flex justify-between items-center">
                <h3 class="font-bold text-sm">⚙️ Pengaturan Toko, Bot & Menu</h3>
                <button onclick="closeSettings()" class="text-blue-200 hover:text-white font-bold text-lg">✕</button>
            </div>
            
            <div class="p-4 overflow-y-auto space-y-4 flex-1 text-xs">
                <!-- Identitas Toko -->
                <div class="bg-gray-50 p-3 rounded-xl border border-gray-200 space-y-2">
                    <h4 class="font-bold text-gray-700">Identitas Toko</h4>
                    <div>
                        <label class="block text-[10px] text-gray-500 font-bold mb-1">Nama Toko / Warung:</label>
                        <input type="text" id="inputStoreName" class="w-full bg-white border border-gray-300 p-2 rounded text-xs font-semibold">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-500 font-bold mb-1">Lokasi / Keterangan:</label>
                        <input type="text" id="inputStoreLocation" class="w-full bg-white border border-gray-300 p-2 rounded text-xs font-semibold">
                    </div>
                    <button onclick="saveStoreInfo()" class="w-full bg-blue-900 text-white py-2 rounded font-bold tap-effect hover:bg-blue-800">Simpan Identitas</button>
                </div>

                <!-- Konfigurasi Bot Telegram Pembeli -->
                <div class="bg-gray-50 p-3 rounded-xl border border-gray-200 space-y-2">
                    <h4 class="font-bold text-gray-700">Koneksi Bot Telegram</h4>
                    <div>
                        <label class="block text-[10px] text-gray-500 font-bold mb-1">Telegram Bot Token:</label>
                        <input type="text" id="inputBotToken" placeholder="Contoh: 123456789:ABCdef..." class="w-full bg-white border border-gray-300 p-2 rounded text-xs font-mono">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-500 font-bold mb-1">Telegram Chat ID:</label>
                        <input type="text" id="inputChatId" placeholder="Contoh: 7933777456" class="w-full bg-white border border-gray-300 p-2 rounded text-xs font-mono">
                    </div>
                    <button onclick="saveTelegramConfig()" class="w-full bg-slate-800 text-white py-2 rounded font-bold tap-effect hover:bg-slate-700">Simpan Bot Telegram</button>
                </div>

                <!-- Tambah Produk Baru -->
                <div class="bg-gray-50 p-3 rounded-xl border border-gray-200 space-y-2">
                    <h4 class="font-bold text-gray-700">Tambah Menu Produk</h4>
                    <div>
                        <label class="block text-[10px] text-gray-500 font-bold mb-1">Nama Produk:</label>
                        <input type="text" id="newProductName" placeholder="Contoh: Kopi / Mie Ayam" class="w-full bg-white border border-gray-300 p-2 rounded text-xs">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-500 font-bold mb-1">Harga (Rp):</label>
                        <input type="number" id="newProductPrice" placeholder="Contoh: 4000" class="w-full bg-white border border-gray-300 p-2 rounded text-xs">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-500 font-bold mb-1">Warna Tombol:</label>
                        <select id="newProductColor" class="w-full bg-white border border-gray-300 p-2 rounded text-xs font-bold">
                            <option value="bg-amber-800 text-white">Cokelat (Kopi/Minuman)</option>
                            <option value="bg-yellow-500 text-black">Kuning (Mie/Makanan)</option>
                            <option value="bg-blue-600 text-white">Biru</option>
                            <option value="bg-red-600 text-white">Merah</option>
                            <option value="bg-emerald-600 text-white">Hijau</option>
                            <option value="bg-indigo-600 text-white">Ungu / Indigo</option>
                            <option value="bg-white text-gray-800 border-gray-300">Putih Neutral</option>
                        </select>
                    </div>
                    <button onclick="addNewProduct()" class="w-full bg-green-600 text-white py-2 rounded font-bold tap-effect hover:bg-green-700">+ Tambah Produk</button>
                </div>

                <!-- Daftar Produk & Hapus -->
                <div class="bg-gray-50 p-3 rounded-xl border border-gray-200 space-y-2">
                    <h4 class="font-bold text-gray-700">Daftar Produk Toko</h4>
                    <div id="customProductList" class="space-y-1 max-h-32 overflow-y-auto">
                        <!-- List produk muncul disini -->
                    </div>
                </div>
            </div>
            
            <div class="p-3 bg-gray-100 border-t border-gray-200 text-right">
                <button onclick="closeSettings()" class="bg-gray-700 text-white px-4 py-2 rounded font-bold text-xs">Tutup</button>
            </div>
        </div>
    </div>

    <script>
        let cart = {};
        let orderNumber = localStorage.getItem('lastOrderNo') ? parseInt(localStorage.getItem('lastOrderNo')) + 1 : 1001;
        let totalBelanja = 0;
        let uangBayar = 0;

        let storeName = localStorage.getItem('storeName') || "Toko / Warung Saya";
        let storeLocation = localStorage.getItem('storeLocation') || "Silakan Atur di Pengaturan";
        let customProducts = JSON.parse(localStorage.getItem('customProducts')) || [];
        
        let teleToken = localStorage.getItem('teleToken') || "";
        let teleChatId = localStorage.getItem('teleChatId') || "";

        document.addEventListener('DOMContentLoaded', () => {
            applyStoreInfo();
            renderMenu();
            updateOrderNoDisplay();
            renderCart();
        });

        function applyStoreInfo() {
            document.getElementById('storeNameDisplay').innerText = storeName;
            document.getElementById('storeLocationDisplay').innerText = storeLocation;
            document.getElementById('pageTitle').innerText = "Kasir " + storeName;
        }

        function updateOrderNoDisplay() {
            document.getElementById('orderNo').innerText = `#${orderNumber}`;
        }

        function renderMenu() {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '';

            if (customProducts.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center p-8 text-center text-gray-400">
                        <p class="text-xs mb-2">Belum ada menu produk.</p>
                        <button onclick="openSettings()" class="bg-blue-600 text-white px-3 py-1.5 rounded text-xs font-bold">⚙️ Tambah Produk Sekarang</button>
                    </div>`;
                return;
            }

            customProducts.forEach((item, index) => {
                const btn = document.createElement('button');
                const colorClass = item.color || "bg-white text-gray-800 border-gray-300";
                
                btn.className = `${colorClass} shadow-sm tap-effect relative p-1 rounded-lg hover:shadow flex flex-col items-center justify-center h-16 w-full transition-all border border-transparent hover:brightness-110`;
                btn.onclick = () => addToCart(item);
                btn.innerHTML = `
                    <span class="font-bold text-xs leading-tight text-center mb-0.5">${item.name}</span>
                    <span class="text-[9px] font-mono opacity-90 bg-black/20 px-1 py-0.5 rounded">Rp ${item.price.toLocaleString('id-ID')}</span>
                `;
                grid.appendChild(btn);
            });
        }

        function addToCart(item) {
            if (cart[item.name]) {
                cart[item.name].qty++;
                cart[item.name].subtotal = cart[item.name].qty * item.price;
            } else {
                cart[item.name] = { price: item.price, qty: 1, subtotal: item.price };
            }
            uangBayar = 0; 
            renderCart();
            if (navigator.vibrate) navigator.vibrate(40);
        }

        function removeFromCart(itemName) {
            if (cart[itemName]) {
                cart[itemName].qty--;
                if (cart[itemName].qty <= 0) {
                    delete cart[itemName];
                } else {
                    cart[itemName].subtotal = cart[itemName].qty * cart[itemName].price;
                }
                uangBayar = 0;
                renderCart();
                if (navigator.vibrate) navigator.vibrate(30);
            }
        }

        function setBayar(nominal) {
            if (totalBelanja === 0) return;
            if (nominal === 'pas') {
                uangBayar = totalBelanja;
            } else {
                uangBayar = nominal;
            }
            updateKembalian();
            if (navigator.vibrate) navigator.vibrate(30);
        }

        function updateKembalian() {
            const kembalianEl = document.getElementById('kembalianDisplay');
            if (uangBayar === 0) {
                kembalianEl.innerText = "-";
                kembalianEl.className = "font-bold text-sm text-gray-400";
            } else {
                let kembali = uangBayar - totalBelanja;
                if (kembali < 0) {
                    kembalianEl.innerText = "Kurang Rp " + Math.abs(kembali).toLocaleString('id-ID');
                    kembalianEl.className = "font-bold text-sm text-red-600";
                } else {
                    kembalianEl.innerText = "Rp " + kembali.toLocaleString('id-ID');
                    kembalianEl.className = "font-bold text-sm text-green-600";
                }
            }
        }

        function renderCart() {
            const list = document.getElementById('cartList');
            const totalEl = document.getElementById('totalDisplay');
            
            list.innerHTML = '';
            totalBelanja = 0;
            const items = Object.entries(cart);

            if (items.length === 0) {
                list.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-gray-400 opacity-50 pt-6">
                        <p class="text-xs">Keranjang kosong</p>
                    </div>`;
                totalEl.innerText = "Rp 0";
                updateKembalian();
                return;
            }

            items.forEach(([name, data]) => {
                totalBelanja += data.subtotal;
                const row = document.createElement('div');
                row.className = "flex justify-between items-center bg-white p-2 rounded-md border border-gray-100 shadow-sm";
                row.innerHTML = `
                    <div class="flex-1">
                        <div class="font-bold text-gray-800 text-xs">${name}</div>
                        <div class="text-[10px] text-gray-500 font-mono">${data.qty} x ${data.price.toLocaleString('id-ID')}</div>
                    </div>
                    <div class="text-right flex flex-row items-center gap-2">
                        <div class="font-bold text-amber-700 text-xs">Rp ${data.subtotal.toLocaleString('id-ID')}</div>
                        <button onclick="removeFromCart('${name}')" class="bg-red-50 text-red-500 border border-red-200 w-5 h-5 rounded flex items-center justify-center text-base font-bold hover:bg-red-100">-</button>
                    </div>
                `;
                list.appendChild(row);
            });

            totalEl.innerText = "Rp " + totalBelanja.toLocaleString('id-ID');
            updateKembalian();
        }

        function resetCart() {
            if (Object.keys(cart).length > 0 && confirm("Hapus semua pesanan?")) {
                cart = {};
                uangBayar = 0;
                renderCart();
            }
        }

        // --- PENGATURAN / MODAL LOGIC ---
        function openSettings() {
            document.getElementById('inputStoreName').value = storeName;
            document.getElementById('inputStoreLocation').value = storeLocation;
            document.getElementById('inputBotToken').value = teleToken;
            document.getElementById('inputChatId').value = teleChatId;
            renderCustomProductList();
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function saveStoreInfo() {
            const sName = document.getElementById('inputStoreName').value.trim();
            const sLoc = document.getElementById('inputStoreLocation').value.trim();
            if (!sName) { alert("Nama toko tidak boleh kosong!"); return; }

            storeName = sName;
            storeLocation = sLoc;
            localStorage.setItem('storeName', storeName);
            localStorage.setItem('storeLocation', storeLocation);

            applyStoreInfo();
            alert("Identitas toko berhasil diperbarui!");
        }

        function saveTelegramConfig() {
            teleToken = document.getElementById('inputBotToken').value.trim();
            teleChatId = document.getElementById('inputChatId').value.trim();
            localStorage.setItem('teleToken', teleToken);
            localStorage.setItem('teleChatId', teleChatId);
            alert("Konfigurasi Telegram berhasil disimpan!");
        }

        function addNewProduct() {
            const pName = document.getElementById('newProductName').value.trim();
            const pPrice = parseInt(document.getElementById('newProductPrice').value);
            const pColor = document.getElementById('newProductColor').value;

            if (!pName || isNaN(pPrice) || pPrice <= 0) {
                alert("Masukkan nama produk dan harga yang valid!");
                return;
            }

            customProducts.push({ name: pName, price: pPrice, color: pColor });
            localStorage.setItem('customProducts', JSON.stringify(customProducts));

            document.getElementById('newProductName').value = "";
            document.getElementById('newProductPrice').value = "";

            renderMenu();
            renderCustomProductList();
        }

        function renderCustomProductList() {
            const listEl = document.getElementById('customProductList');
            if (customProducts.length === 0) {
                listEl.innerHTML = '<p class="text-gray-400 italic text-[10px]">Belum ada produk.</p>';
                return;
            }
            listEl.innerHTML = '';
            customProducts.forEach((p, idx) => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-white p-1.5 rounded border border-gray-200 text-xs";
                div.innerHTML = `
                    <span><b>${p.name}</b> (Rp ${p.price.toLocaleString('id-ID')})</span>
                    <button onclick="deleteCustomProduct(${idx})" class="text-red-500 font-bold px-2 py-0.5 bg-red-50 rounded border border-red-200">Hapus</button>
                `;
                listEl.appendChild(div);
            });
        }

        function deleteCustomProduct(index) {
            if (confirm(`Hapus produk "${customProducts[index].name}"?`)) {
                customProducts.splice(index, 1);
                localStorage.setItem('customProducts', JSON.stringify(customProducts));
                renderMenu();
                renderCustomProductList();
            }
        }

        // --- FITUR CETAK / BAGIKAN UNIVERSAL (MEMUNCULKAN MENU SHARE ANDROID) ---
        async function shareStrukUniversal() {
            if (Object.keys(cart).length === 0) {
                alert("Keranjang masih kosong!");
                return;
            }

            let text = `================================\n`;
            text += `        ${storeName.toUpperCase()}\n`;
            text += `     ${storeLocation}\n`;
            text += `================================\n`;
            text += `No Pesanan : #${orderNumber}\n`;
            text += `Tanggal    : ${new Date().toLocaleDateString('id-ID')} ${new Date().toLocaleTimeString('id-ID').substring(0,5)}\n`;
            text += `--------------------------------\n`;

            for (let name in cart) {
                let item = cart[name];
                text += `${name}\n`;
                text += `  ${item.qty}x @ Rp ${item.price.toLocaleString('id-ID')} = Rp ${item.subtotal.toLocaleString('id-ID')}\n`;
            }

            text += `--------------------------------\n`;
            text += `TOTAL TAGIHAN : Rp ${totalBelanja.toLocaleString('id-ID')}\n`;
            
            if (uangBayar > 0) {
                text += `TUNAI         : Rp ${uangBayar.toLocaleString('id-ID')}\n`;
                let kembali = uangBayar - totalBelanja;
                text += `KEMBALI       : Rp ${kembali > 0 ? kembali.toLocaleString('id-ID') : 0}\n`;
            }

            text += `================================\n`;
            text += `    Terima Kasih Telah Berkunjung!\n`;
            text += `================================\n`;

            // Memunculkan menu share sheet bawaan HP Android
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Struk #' + orderNumber,
                        text: text,
                    });
                    orderNumber++;
                    localStorage.setItem('lastOrderNo', orderNumber);
                    updateOrderNoDisplay();
                } catch (err) {
                    console.log('Bagikan dibatalkan');
                }
            } else {
                alert("Fitur bagikan otomatis tidak didukung di browser ini.");
            }
        }

        // --- FITUR BAGIKAN KE WHATSAPP ---
        function shareWhatsApp() {
            if (Object.keys(cart).length === 0) {
                alert("Keranjang masih kosong!");
                return;
            }

            let waText = `*${storeName}*\n_${storeLocation}_\n\n`;
            waText += `📦 *No Pesanan:* #${orderNumber}\n`;
            waText += `🕒 *Waktu:* ${new Date().toLocaleDateString('id-ID')} ${new Date().toLocaleTimeString('id-ID').substring(0,5)}\n`;
            waText += `--------------------------------\n`;

            for (let name in cart) {
                let item = cart[name];
                waText += `▪️ ${name} (${item.qty}x @${item.price.toLocaleString('id-ID')}) = *Rp ${item.subtotal.toLocaleString('id-ID')}*\n`;
            }

            waText += `--------------------------------\n`;
            waText += `💰 *TOTAL TAGIHAN: Rp ${totalBelanja.toLocaleString('id-ID')}*\n`;

            if (uangBayar > 0) {
                waText += `💵 Tunai: Rp ${uangBayar.toLocaleString('id-ID')}\n`;
                let kembali = uangBayar - totalBelanja;
                waText += `🔄 Kembali: Rp ${kembali > 0 ? kembali.toLocaleString('id-ID') : 0}\n`;
            }

            waText += `\n_Terima kasih telah berbelanja!_ 🙏`;

            const whatsappUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(waText);
            window.open(whatsappUrl, '_blank');

            orderNumber++;
            localStorage.setItem('lastOrderNo', orderNumber);
            updateOrderNoDisplay();
        }

        // --- LOGIKA TELEGRAM ---
        async function kirimTelegramManual() {
            if (!teleToken || !teleChatId) {
                alert("⚠️ Bot Telegram belum diatur!\nSilakan buka menu Pengaturan (⚙️) di pojok kanan atas untuk memasukkan Token Bot & Chat ID Anda.");
                openSettings();
                return;
            }

            const inputEl = document.getElementById('inputPemasukan');
            const nominalValue = inputEl.value;
            const btn = document.getElementById('btnKirimTelegram');
            const namaPenjaga = document.getElementById('namaPenjaga').value.trim() || "Kasir";

            if (!nominalValue || isNaN(nominalValue) || parseInt(nominalValue) <= 0) {
                alert("Masukkan nominal pemasukan yang valid!");
                inputEl.focus();
                return;
            }

            const nominal = parseInt(nominalValue);
            if(!confirm(`Kirim laporan pemasukan Rp ${nominal.toLocaleString('id-ID')} atas nama ${namaPenjaga} ke Telegram?`)) return;

            const originalText = btn.innerHTML;
            btn.innerHTML = "Mengirim...";
            btn.disabled = true;

            const waktu = new Date().toLocaleString('id-ID', {
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });

            const pesan = `📊 *LAPORAN PEMASUKAN TOKO*\n🏠 *${storeName}* (${storeLocation})\n\n👤 *Penjaga:* ${namaPenjaga}\n💰 *Nominal:* Rp ${nominal.toLocaleString('id-ID')}\n🕒 *Waktu:* ${waktu}`;

            try {
                const response = await fetch(`https://api.telegram.org/bot${teleToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: teleChatId, text: pesan, parse_mode: 'Markdown' })
                });

                const data = await response.json();
                if (data.ok) {
                    alert("✅ Laporan sukses terkirim ke Telegram!");
                    inputEl.value = "";
                } else {
                    alert("❌ Gagal: " + data.description);
                }
            } catch (err) {
                alert("❌ Kesalahan jaringan saat menghubungi Telegram.");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>
